<shr-popup
  [(isVisible)]="isvisible"
  (cancelClick)="handleCancel()"
  (confirmClick)="handleOk()"
  [title]="type == 'create' ? 'Tạo yêu cầu làm thêm giờ' : 'Cập nhật yêu cầu làm thêm giờ'"
  width="800px"
>
  <div nz-row [nzGutter]="[24, 0]">
    <div nz-col nzSpan="12" class="shr-group-input">
      <span class="shr-label-input">Mã nhân viên</span>
      <input
        type="text"
        nz-input
        placeholder="Nhập mã nhân viên"
        [(ngModel)]="dataInput.employee_code"
        nz-popover
        nzPopoverTitle="Danh sách nhân viên"
        nzPopoverTrigger="click"
        [nzPopoverContent]="popListEmployee"
        nzPopoverPlacement="right"
        [(nzPopoverVisible)]="isVisiblePopListEmployee"
      />
    </div>
    <div nz-col nzSpan="12" class="shr-group-input">
      <span class="shr-label-input">Ngày làm việc</span>
      <nz-date-picker
        [(ngModel)]="dataInput.work_date"
        nzFormat="dd/MM/yyyy"
        class="shr-w-full"
      ></nz-date-picker>
    </div>
    <div nz-col nzSpan="12" class="shr-group-input">
      <span class="shr-label-input">Thời gian bắt đầu</span>
      <nz-time-picker
        [(ngModel)]="dataInput.start_time"
        [nzFormat]="'HH:mm'"
        class="shr-w-full"
      ></nz-time-picker>
    </div>
    <div nz-col nzSpan="12" class="shr-group-input">
      <span class="shr-label-input">Thời gian kết thúc</span>
      <nz-time-picker
        [(ngModel)]="dataInput.end_time"
        [nzFormat]="'HH:mm'"
        class="shr-w-full"
      ></nz-time-picker>
    </div>
    <div nz-col nzSpan="24" class="shr-group-input">
      <span class="shr-label-input">Lý do làm thêm giờ</span>
      <textarea
        nz-input
        type="text"
        placeholder="Nhập lý do làm thêm giờ"
        [(ngModel)]="dataInput.reason"
        rows="4"
      ></textarea>
    </div>
  </div>
</shr-popup>

<ng-template #popListEmployee>
  <nz-table nzSize="small" nzShowPagination="false" [nzData]="listEmployee" nzBordered>
    <thead>
      <tr>
        <th>Mã nhân viên</th>
        <th>Họ tên</th>
        <th>Phòng ban</th>
        <th>Vị trí</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of listEmployee" (click)="chooseEmployee(item)">
        <td>{{ item.employee_code }}</td>
        <td>{{ item.last_name + ' ' + item.first_name }}</td>
        <td>{{ item.department?.department_name }}</td>
        <td>{{ item.jobPosition?.job_name }}</td>
      </tr>
    </tbody>
  </nz-table>
</ng-template>
